name: Build tracker pages

on:
  push:
    paths:
      - 'trackers/cases.yaml'
      - 'trackers/foreign-actions.yaml'
      - 'trackers/linkages.yaml'
      - 'scripts/build_pages.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/build_pages.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- docs 2>/dev/null || true
          git diff --staged --quiet || git commit -m "docs: regenerate tracker pages"
          git pull --rebase -X theirs origin main
          git push
