name: Brazil Legislature Signals

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'trackers/legislative-signals.yaml'
      - 'scripts/fetch_brazil_legislature.py'

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  legislature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Scan Câmara and Senado
        run: python scripts/fetch_brazil_legislature.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data docs/trackers 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: legislature $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
