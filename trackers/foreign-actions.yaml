- id: ofac-moraes-designation-2025-07
  date: 2025-07-30
  actor: US Treasury / OFAC
  instrument: Global Magnitsky designation (SDN List)
  target: Alexandre de Moraes (STF Justice)
  summary: First use of the Global Magnitsky Act against a Brazilian public official; assets in US jurisdiction blocked and US persons barred from dealing with him.
  status: {announced: 2025-07-30, published: 2025-07-30, in_force: false, lifted: 2025-12-12}
  sources:
    - {tier: 1, outlet: OFAC recent actions, url: "https://ofac.treasury.gov/recent-actions", note: "30 Jul 2025 entry — to resolve via agency-releases targets"}
    - {tier: 3, outlet: Courthouse News, url: "https://www.courthousenews.com/us-sanctions-brazil-supreme-court-justice-overseeing-bolsonaro-trial/"}
    - {tier: 3, outlet: Barnes & Thornburg, url: "https://btlaw.com/en/insights/alerts/2025/us-sanctions-brazilian-supreme-court-justice-places-50-tariff-on-brazilian-imports"}

